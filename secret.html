<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 彩蛋 ✨</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: var(--white); }
    .secret-page {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: var(--spacing-lg);
    }
    .secret-card {
      background: var(--white);
      border: var(--border-thick) solid var(--green);
      padding: var(--spacing-xl) var(--spacing-lg);
      max-width: 480px;
    }
    .secret-icon { font-size: 3rem; margin-bottom: var(--spacing-sm); }
    .secret-title { font-size: 1.4rem; font-weight: 700; color: var(--green); margin-bottom: var(--spacing-md); }
    .secret-text { font-size: 0.95rem; line-height: 2; color: var(--gray-dark); }
    .secret-back {
      display: inline-block; margin-top: var(--spacing-lg);
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em;
      color: var(--green); text-decoration: none; border-bottom: 1px solid var(--green);
      padding-bottom: 2px; transition: all 0.2s;
    }
    .secret-back:hover { color: var(--black); border-color: var(--black); }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <main class="secret-page">
    <div class="secret-card">
      <div class="secret-icon">🎉</div>
      <h1 class="secret-title">嘿嘿，没什么特殊的东西啦。</h1>
      <p class="secret-text">但是这个彩蛋只有你能看到哦，除非专门看我html的坏叔叔w</p>
      <a href="index.html" class="secret-back">← 返回首页</a>
    </div>
  </main>
</body>
</html>
